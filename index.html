<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงเวลาและบันทึกข้อมูล</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1e88e5, #1565c0);
            color: white;
            padding: 24px 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .clock {
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.2);
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            margin-top: 8px;
        }
        .form-section {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: #444;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #1e88e5;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-in {
            background-color: #2e7d32;
        }
        .btn-out {
            background-color: #d32f2f;
        }
        .history-section {
            padding: 0 20px 20px 20px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .history-header h2 {
            font-size: 1.05rem;
            color: #1565c0;
        }
        .btn-export {
            background-color: #0288d1;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .record-card {
            background: #f8fafc;
            border-left: 4px solid #1e88e5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .record-card.out {
            border-left-color: #d32f2f;
        }
        .record-card.in {
            border-left-color: #2e7d32;
        }
        .record-info h4 {
            font-size: 0.95rem;
            margin-bottom: 3px;
        }
        .record-info p {
            font-size: 0.8rem;
            color: #666;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
            color: white;
        }
        .badge.in { background-color: #2e7d32; }
        .badge.out { background-color: #d32f2f; }
        .empty-text {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            padding: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>ระบบบันทึกเวลา & ข้อมูลงาน</h1>
        <p style="font-size: 0.85rem; opacity: 0.9;">บันทึกการเข้า-ออกงานและรายละเอียดประจำวัน</p>
        <div class="clock" id="liveClock">กำลังโหลดเวลา...</div>
    </div>

    <div class="form-section">
        <div class="form-group">
            <label for="empName">ชื่อ-นามสกุล / รหัสพนักงาน</label>
            <input type="text" id="empName" placeholder="เช่น สุจิรา (ป๊อป)" required>
        </div>

        <div class="form-group">
            <label for="department">แผนก / หมวดงาน</label>
            <select id="department">
                <option value="Autoliv">Autoliv</option>
                <option value="Customer">Customer</option>
                <option value="Solder">Solder</option>
                <option value="อื่นๆ">อื่นๆ</option>
            </select>
        </div>

        <div class="form-group">
            <label for="note">รายละเอียดงาน / หมายเหตุ (ถ้ามี)</label>
            <input type="text" id="note" placeholder="เช่น ตรวจเช็กจิ๊ก / เข้ากะปกติ">
        </div>

        <div class="btn-group">
            <button class="btn btn-in" onclick="saveRecord('เข้างาน')">🟢 บันทึกเข้างาน</button>
            <button class="btn btn-out" onclick="saveRecord('ออกงาน')">🔴 บันทึกออกงาน</button>
        </div>
    </div>

    <div class="history-section">
        <div class="history-header">
            <h2>ประวัติการบันทึก</h2>
            <button class="btn-export" onclick="exportToCSV()">📥 โหลดไฟล์ CSV</button>
        </div>
        <div id="recordList"></div>
    </div>
</div>

<script>
    // แสดงนาฬิกาเรียลไทม์
    function updateClock() {
        const now = new Date();
        const options = { 
            year: 'numeric', month: 'short', day: 'numeric',
            hour: '2-digit', minute: '2-digit', second: '2-digit'
        };
        document.getElementById('liveClock').innerText = now.toLocaleDateString('th-TH', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // โหลดข้อมูลที่เคยบันทึกไว้
    let records = JSON.parse(localStorage.getItem('attendanceRecords')) || [];

    function renderRecords() {
        const listDiv = document.getElementById('recordList');
        if (records.length === 0) {
            listDiv.innerHTML = '<div class="empty-text">ยังไม่มีข้อมูลการบันทึกในวันนี้</div>';
            return;
        }

        listDiv.innerHTML = '';
        records.forEach((item) => {
            const statusClass = item.type === 'เข้างาน' ? 'in' : 'out';
            const card = document.createElement('div');
            card.className = `record-card ${statusClass}`;
            card.innerHTML = `
                <div class="record-info">
                    <h4>${item.name} <span style="font-weight:400; color:#555;">(${item.dept})</span></h4>
                    <p>🕒 ${item.time}</p>
                    ${item.note ? `<p>📝 ${item.note}</p>` : ''}
                </div>
                <span class="badge ${statusClass}">${item.type}</span>
            `;
            listDiv.appendChild(card);
        });
    }

    // บันทึกข้อมูลใหม่
    function saveRecord(type) {
        const name = document.getElementById('empName').value.trim();
        const dept = document.getElementById('department').value;
        const note = document.getElementById('note').value.trim();

        if (!name) {
            alert('กรุณากรอกชื่อ-นามสกุล ก่อนกดบันทึกนะคะ');
            return;
        }

        const now = new Date();
        const timeString = now.toLocaleDateString('th-TH', {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit'
        });

        const newRecord = {
            name: name,
            dept: dept,
            type: type,
            time: timeString,
            note: note
        };

        records.unshift(newRecord); // เพิ่มรายการล่าสุดไว้บนสุด
        localStorage.setItem('attendanceRecords', JSON.stringify(records));
        
        document.getElementById('note').value = ''; // ล้างช่องหมายเหตุ
        renderRecords();
    }

    // ส่งออกข้อมูลเป็นไฟล์ CSV (เปิดใน Excel ได้)
    function exportToCSV() {
        if (records.length === 0) {
            alert('ยังไม่มีข้อมูลสำหรับดาวน์โหลดค่ะ');
            return;
        }

        let csvContent = "\uFEFFชื่อ-นามสกุล,แผนก,ประเภท,วันและเวลา,หมายเหตุ\n";
        records.forEach(r => {
            csvContent += `"${r.name}","${r.dept}","${r.type}","${r.time}","${r.note}"\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "บันทึกเวลาทำงาน.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // แสดงผลครั้งแรกเมื่อเปิดหน้าเว็บ
    renderRecords();
</script>

</body>
</html>
